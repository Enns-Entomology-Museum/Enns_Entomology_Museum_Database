name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Rebuild once a month so the GBIF Missouri checklist and loan totals stay current
  schedule:
    - cron: '17 6 1 * *'

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # Reinstall explicitly to bypass any committed package-lock.json
      # and guarantee every deploy uses the latest published version.
      - name: Install latest TaxonPages version
        run: npm install @sfgrp/taxonpages

      # Downloads the list of insect species recorded in Missouri from GBIF
      # (public/data/gbif-missouri.json). Never fails the build: if GBIF is
      # unreachable, the copy already in the repository is used.
      - name: Refresh GBIF Missouri checklist
        run: node scripts/gbif-missouri.mjs

      # Adds the insect species with research-grade iNaturalist observations in
      # Missouri (public/data/inat-missouri.json). Runs after the GBIF step, whose
      # list it uses for orders and families. Never fails the build.
      - name: Refresh iNaturalist Missouri checklist
        run: node scripts/inat-missouri.mjs

      # Exports loan totals (loans, specimens per loan, taxa) from TaxonWorks to
      # public/data/loans-summary.json. Loans are not in the public API, so this
      # uses the repository secret TW_USER_TOKEN (a personal TaxonWorks API token).
      # Only totals are written — no names, addresses or e-mails. Never fails the
      # build: without the secret, or on any error, the site shows basic counts.
      - name: Refresh loans summary
        run: node scripts/tw-loans.mjs
        env:
          TW_USER_TOKEN: ${{ secrets.TW_USER_TOKEN }}
          TW_PROJECT_ID: '101'

      - name: Build public view
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
